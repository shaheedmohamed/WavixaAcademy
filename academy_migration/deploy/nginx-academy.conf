server {
    server_name academy.wavixa.net;

    root /www/wwwroot/academy.wavixa.net/backend/public;
    index index.html index.php;

    client_max_body_size 4096m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal-only delivery of HLS video files — PHP authorizes each
    # request via X-Accel-Redirect (CourseShield session check).
    location /protected-videos/ {
        internal;
        alias /www/wwwroot/academy.wavixa.net/backend/storage/app/private/videos/;
    }

    # Laravel API + Sanctum CSRF endpoint
    location ~ ^/(api|sanctum)(/|$) {
        fastcgi_read_timeout 600s;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/academy.wavixa.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/academy.wavixa.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = academy.wavixa.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name academy.wavixa.net;
    return 404; # managed by Certbot


}